[project]
name = "recwatch"
version = "0.1.0"
description = "A tool to track and notify users of permit availabilities on recreation.gov"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
    "tomli-w>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[project.scripts]
recwatch = "recwatch.permit_check:main"